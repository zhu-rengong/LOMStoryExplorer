<!DOCTYPE html>
<html lang="zh-Hant" data-theme="paper" data-font="serif">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f4f0e8">
<title>活俠傳 · 劇本閱讀</title>
<link rel="stylesheet" href="style/00-tokens.css">
<link rel="stylesheet" href="style/05-themes.css">
<link rel="stylesheet" href="style/10-base.css">
<link rel="stylesheet" href="style/20-shell.css">
<link rel="stylesheet" href="style/30-library.css">
<link rel="stylesheet" href="style/40-reader.css">
<link rel="stylesheet" href="style/50-overlays.css">
<link rel="stylesheet" href="style/60-responsive.css">
<link rel="stylesheet" href="style/90-motion.css">
</head>
<body data-mobile-view="read">
<svg class="svg-sprite" aria-hidden="true">
  <symbol id="icon-library" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5zM20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5z"/></symbol>
  <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></symbol>
  <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></symbol>
  <symbol id="icon-theme" viewBox="0 0 24 24"><path d="M20 15.2A8.5 8.5 0 0 1 8.8 4 8.5 8.5 0 1 0 20 15.2Z"/></symbol>
  <symbol id="icon-bookmark" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></symbol>
  <symbol id="icon-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
  <symbol id="icon-link" viewBox="0 0 24 24"><path d="m9.5 14.5 5-5M7.8 17.7l-1.1 1.1a3.5 3.5 0 0 1-5-5l3.5-3.5a3.5 3.5 0 0 1 5 0M16.2 6.3l1.1-1.1a3.5 3.5 0 0 1 5 5l-3.5 3.5a3.5 3.5 0 0 1-5 0" transform="translate(-.1)"/></symbol>
  <symbol id="icon-tree" viewBox="0 0 24 24"><path d="M6 3v12a4 4 0 0 0 4 4h3M6 9h6a4 4 0 0 1 4 4v1M18 3v4M15 5h6M18 16v5M15 19h6"/></symbol>
  <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></symbol>
  <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M4 12h15M14 6l6 6-6 6"/></symbol>
  <symbol id="icon-back" viewBox="0 0 24 24"><path d="M20 12H5M10 6l-6 6 6 6"/></symbol>
  <symbol id="icon-spark" viewBox="0 0 24 24"><path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></symbol>
  <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="icon-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
</svg>
<header class="command-bar">
  <button id="libraryToggle" class="icon-button library-toggle" type="button" data-i18n-title="library" title="書庫"><svg class="icon"><use href="#icon-library"/></svg></button>
  <a class="brand" href="#" aria-label="StoryReader">
    <span class="brand-seal">活</span>
    <span class="brand-copy"><strong data-i18n="appTitle">活俠傳 · 劇本閱讀</strong><small data-i18n="appSubtitle">一卷江湖，諸般因果</small></span>
  </a>
  <form id="searchForm" class="search-command" role="search">
    <svg class="icon search-icon"><use href="#icon-search"/></svg>
    <input id="globalSearch" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="search" placeholder="搜尋編號、正文或角色…" aria-label="Search">
    <kbd>/</kbd>
    <div id="searchPanel" class="search-panel surface" hidden>
      <div class="search-tools">
        <select id="searchChapter" aria-label="Chapter scope"></select>
        <span id="searchStatus" role="status"></span>
      </div>
      <div id="searchResults" class="search-results"></div>
    </div>
  </form>
  <div class="command-actions">
    <div class="language-switch" role="group" aria-label="Language">
      <button type="button" data-lang="zh-tw" class="is-active">繁</button>
      <button type="button" data-lang="zh-cn">简</button>
    </div>
    <button id="themeToggle" class="icon-button" type="button" data-i18n-title="theme" title="主題"><svg class="icon"><use href="#icon-theme"/></svg></button>
    <button class="icon-button" type="button" data-open-settings data-i18n-title="settings" title="設置"><svg class="icon"><use href="#icon-settings"/></svg></button>
  </div>
</header>
<main class="workspace">
  <div id="libraryScrim" class="library-scrim" hidden></div>
  <aside id="libraryPane" class="library-pane" aria-label="Library">
    <div class="pane-heading">
      <div><span class="eyebrow">Story archive</span><h2 data-i18n="library">書庫</h2></div>
      <button id="libraryClose" class="icon-button mobile-only" type="button" data-i18n-title="close"><svg class="icon"><use href="#icon-close"/></svg></button>
    </div>
    <div class="library-tabs" role="tablist">
      <button type="button" role="tab" data-library-view="chapters" class="is-active" data-i18n="chapters">書目</button>
      <button type="button" role="tab" data-library-view="bookmarks" data-i18n="bookmarks">書籤</button>
      <button type="button" role="tab" data-library-view="recent" data-i18n="recent">最近</button>
    </div>
    <div id="libraryContent" class="library-content"></div>
    <footer class="library-foot"><span class="jade-dot"></span><span>Local archive · static edition</span></footer>
  </aside>
  <section id="readerMain" class="reader-main" aria-label="Reader">
    <div id="readProgress" class="read-progress"></div>
    <header class="reader-heading">
      <div class="reader-heading-copy">
        <p id="readerChapter" class="reader-chapter">一卷江湖，諸般因果</p>
        <h1 id="readerTitle">展卷，入江湖</h1>
        <button id="readerId" class="reader-id" type="button" hidden></button>
      </div>
      <div id="readerActions" class="reader-actions" hidden>
        <button id="bookmarkButton" class="icon-button" type="button" data-i18n-title="bookmarkAdd"><svg class="icon"><use href="#icon-bookmark"/></svg></button>
        <button id="copyIdButton" class="icon-button" type="button" data-i18n-title="copyId"><svg class="icon"><use href="#icon-copy"/></svg></button>
        <button id="copyLinkButton" class="icon-button" type="button" data-i18n-title="copyLink"><svg class="icon"><use href="#icon-link"/></svg></button>
        <span class="action-divider"></span>
        <button id="contextButton" class="context-button" type="button"><svg class="icon"><use href="#icon-tree"/></svg><span data-i18n="context">劇情脈絡</span></button>
      </div>
    </header>
    <div id="readerScroll" class="reader-scroll">
      <div id="readerContent" class="reader-content"></div>
    </div>
    <footer id="readerFooter" class="reader-footer" hidden>
      <div class="history-controls">
        <button id="historyBack" class="icon-button" type="button" data-i18n-title="back"><svg class="icon"><use href="#icon-back"/></svg></button>
        <button id="historyForward" class="icon-button" type="button" data-i18n-title="forward"><svg class="icon"><use href="#icon-arrow"/></svg></button>
      </div>
      <span id="progressLabel" class="progress-label">0%</span>
      <button id="continueButton" class="continue-button" type="button"><span data-i18n="next">續讀</span><svg class="icon"><use href="#icon-arrow"/></svg></button>
    </footer>
  </section>
  <aside id="contextPane" class="context-pane" aria-label="Story context">
    <div class="pane-heading">
      <div><span class="eyebrow">Narrative threads</span><h2 data-i18n="context">劇情脈絡</h2></div>
      <button id="contextClose" class="icon-button" type="button" data-i18n-title="close"><svg class="icon"><use href="#icon-close"/></svg></button>
    </div>
    <div id="contextContent" class="context-content"></div>
  </aside>
</main>
<nav class="mobile-nav" aria-label="Mobile navigation">
  <button type="button" data-mobile="library"><svg class="icon"><use href="#icon-library"/></svg><span data-i18n="library">書庫</span></button>
  <button type="button" data-mobile="read" class="is-active"><svg class="icon"><use href="#icon-menu"/></svg><span data-i18n="read">閱讀</span></button>
  <button type="button" data-mobile="bookmarks"><svg class="icon"><use href="#icon-bookmark"/></svg><span data-i18n="bookmarks">書籤</span></button>
  <button type="button" data-mobile="settings"><svg class="icon"><use href="#icon-settings"/></svg><span data-i18n="settings">設置</span></button>
</nav>
<dialog id="settingsDialog" class="settings-dialog surface">
  <div class="dialog-heading">
    <div><span class="eyebrow">Reading preferences</span><h2 data-i18n="settings">設置</h2></div>
    <form method="dialog"><button class="icon-button" type="submit" data-i18n-title="close"><svg class="icon"><use href="#icon-close"/></svg></button></form>
  </div>
  <section class="setting-section">
    <h3 data-i18n="language">語言</h3>
    <div class="segmented-control">
      <button type="button" data-lang="zh-tw">繁體中文</button>
      <button type="button" data-lang="zh-cn">简体中文</button>
    </div>
  </section>
  <section class="setting-section">
    <h3 data-i18n="theme">主題</h3>
    <div class="choice-cards">
      <label><input type="radio" name="theme" value="system" data-setting="theme"><span data-i18n="system">跟隨系統</span></label>
      <label><input type="radio" name="theme" value="paper" data-setting="theme"><span data-i18n="paper">宣紙</span></label>
      <label><input type="radio" name="theme" value="night" data-setting="theme"><span data-i18n="night">墨色</span></label>
    </div>
  </section>
  <section class="setting-section">
    <h3 data-i18n="typography">排版</h3>
    <div class="choice-cards two-columns">
      <label><input type="radio" name="font" value="serif" data-setting="font"><span data-i18n="serif">宋體</span></label>
      <label><input type="radio" name="font" value="sans" data-setting="font"><span data-i18n="sans">黑體</span></label>
    </div>
    <label class="range-setting"><span data-i18n="fontSize">字號</span><input type="range" min="16" max="26" step="1" data-setting="fontSize"><output id="fontSizeValue"></output></label>
    <label class="range-setting"><span data-i18n="lineHeight">行距</span><input type="range" min="1.5" max="2.3" step="0.1" data-setting="lineHeight"><output id="lineHeightValue"></output></label>
    <label class="range-setting"><span data-i18n="width">正文寬度</span><input type="range" min="560" max="900" step="20" data-setting="width"><output id="widthValue"></output></label>
  </section>
  <button id="resetSettings" class="secondary-button" type="button" data-i18n="reset">恢復預設</button>
</dialog>
<div id="toast" class="toast" role="status" hidden></div>
<div id="fatalError" class="fatal-error" hidden>
  <div class="fatal-card surface"><span class="empty-seal">卷</span><h1 data-i18n="dataError">資料未能載入</h1><p data-i18n="dataErrorBody"></p><code data-error-message></code></div>
</div>
<script src="data/catalog.js"></script>
<script src="js/00-core.js"></script>
<script src="js/05-store.js"></script>
<script src="js/10-storage.js"></script>
<script src="js/15-data.js"></script>
<script src="js/20-text.js"></script>
<script src="js/25-search.js"></script>
<script src="js/29-i18n-dict.js"></script>
<script src="js/30-i18n.js"></script>
<script src="js/35-router.js"></script>
<script src="js/40-library.js"></script>
<script src="js/45-reader.js"></script>
<script src="js/50-navigation.js"></script>
<script src="js/55-settings.js"></script>
<script src="js/60-overlays.js"></script>
<script src="js/90-app.js"></script>
</body>
</html>
