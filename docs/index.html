<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>活俠傳 · 劇本檢索</title>
<link rel="stylesheet" href="style/00-tokens.css">
<link rel="stylesheet" href="style/10-base.css">
<link rel="stylesheet" href="style/20-shell.css">
<link rel="stylesheet" href="style/30-controls.css">
<link rel="stylesheet" href="style/40-reader.css">
<link rel="stylesheet" href="style/50-panels.css">
<link rel="stylesheet" href="style/60-responsive.css">
<link rel="stylesheet" href="style/90-motion.css">
<script src="js/00-runtime.js"></script>
<script src="js/01-prefs.js"></script>
<script src="js/05-ui.js"></script>
<script src="js/30-i18n-data.js"></script>
<script src="js/31-lang.js"></script>
</head>
<body data-layout="wide">

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.6"/><path d="M15.7 15.7 20.5 20.5"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3.2v2.2M12 18.6v2.2M4.8 7.9l1.9 1.1M17.3 15l1.9 1.1M4.8 16.1l1.9-1.1M17.3 9l1.9-1.1"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.4 5.2 7.6 12l6.8 6.8"/></symbol>
  <symbol id="i-forward" viewBox="0 0 24 24"><path d="M9.6 5.2 16.4 12l-6.8 6.8"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.4 6.4l11.2 11.2M17.6 6.4 6.4 17.6"/></symbol>
  <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3.4" y="4.4" width="17.2" height="15.2" rx="1.6"/><path d="M9.4 4.4v15.2"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6.5 9.4 5.5 5.4 5.5-5.4"/></symbol>
  <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3.6 5.4h16.8l-6.5 7.4v5.9l-3.8 1.9v-7.8L3.6 5.4z"/></symbol>
  <symbol id="i-stats" viewBox="0 0 24 24"><path d="M4.6 19.4V11M12 19.4V5M19.4 19.4v-5.2"/><path d="M2.8 19.4h18.4"/></symbol>
  <symbol id="i-jump" viewBox="0 0 24 24"><path d="M5.2 19.4V9.2a3 3 0 0 1 3-3h8.4"/><path d="m13.4 3.2 3 3-3 3"/><circle cx="5.2" cy="19.4" r="1.4"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 4.2 2.5 5.2 5.7.8-4.1 4 1 5.7-5.1-2.8-5.1 2.8 1-5.7-4.1-4 5.7-.8L12 4.2z"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.6" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18.4" cy="12" r="1.2"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4"/><path d="M9.7 9.5a2.5 2.5 0 0 1 4.7 1.1c0 1.7-2.2 1.9-2.2 3.3"/><circle cx="12" cy="17" r=".9" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-lang" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4"/><path d="M3.6 12h16.8"/><path d="M12 3.6c2.4 2.3 3.6 5.2 3.6 8.4s-1.2 6.1-3.6 8.4c-2.4-2.3-3.6-5.2-3.6-8.4s1.2-6.1 3.6-8.4z"/></symbol>
</svg>

<header class="masthead">
  <button id="railToggle" class="btn btn-icon rail-toggle" type="button" aria-expanded="false" aria-controls="chapterRail"
          data-i18n-title="railToggleTitle" title="目錄欄">
    <svg><use href="#i-panel"/></svg>
  </button>

  <div class="brand">
    <span class="seal" aria-hidden="true">活</span>
    <div class="brand-text">
      <div class="brand-main">
        <h1 data-i18n="appTitle">活俠傳 · 劇本檢索</h1>
        <p id="metaLine" data-i18n="loading">載入中…</p>
      </div>
      <p id="buildLine" class="brand-build"></p>
    </div>
  </div>

  <div class="searchwrap">
    <div class="search-field">
      <svg class="search-icon" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="search" class="search-input" type="search" autocomplete="off" spellcheck="false" role="combobox"
             aria-expanded="false" aria-controls="searchResults"
             data-i18n-placeholder="searchPlaceholder" data-i18n-title="searchTitle"
             placeholder="搜尋對白、旁白、心聲、選項、劇情點"
             data-i18n-label="searchPlaceholder"
             aria-label="搜尋對白、旁白、心聲、選項、劇情點">
      <kbd class="search-key" aria-hidden="true">/</kbd>
      <div id="searchResults" class="dropdown surface popover" role="listbox" hidden></div>
    </div>

    <div class="menu-wrap" id="filterWrap">
      <button id="filterBtn" class="btn filter-btn" type="button" aria-haspopup="dialog" aria-expanded="false"
              aria-controls="filterPanel"
              data-i18n-title="filterBtnTitle" title="用條件篩選劇本">
        <svg class="ico" aria-hidden="true"><use href="#i-filter"/></svg>
        <span class="btn-label" data-i18n="filterBtn">篩選</span>
        <span id="filterBadge" class="badge badge-solid badge-num" hidden>0</span>
      </button>
      <div id="filterPanel" class="filter-panel surface popover" role="dialog" data-i18n-label="filterBtn" aria-label="篩選" hidden>
        <div class="filter-row">
          <div class="filter-input-wrap">
            <input id="filterExpr" class="input input-mono" type="text" spellcheck="false" autocomplete="off"
                   role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="filterSuggest"
                   data-i18n-placeholder="filterPlaceholder"
                   data-i18n-label="filterPlaceholder"
                   placeholder="speaker:master AND (dice:yes OR lock:yes)">
            <div id="filterSuggest" class="filter-suggest surface popover" role="listbox" hidden></div>
          </div>
          <button id="filterApply" class="btn" type="button" data-i18n="filterApply">套用</button>
        </div>
        <div id="filterStatus" class="filter-status"></div>

        <div class="filter-section">
          <p class="filter-label" data-i18n="filterFields">欄位</p>
          <div class="filter-chips" id="filterFieldChips"></div>
        </div>
        <div class="filter-section">
          <p class="filter-label" data-i18n="filterOperators">邏輯</p>
          <div class="filter-chips" id="filterOpChips"></div>
        </div>
        <div class="filter-section">
          <p class="filter-label" data-i18n="filterExamples">範例</p>
          <div class="filter-chips" id="filterExampleChips"></div>
        </div>

        <div id="filterResults" class="filter-results" hidden></div>

        <div class="filter-foot">
          <span id="filterCount" class="filter-count"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="tools" id="toolbar">
    <div class="menu-wrap" id="langWrap">
      <button id="langBtn" class="btn btn-icon" type="button" aria-haspopup="true" aria-expanded="false"
              aria-controls="langMenu"
              data-i18n-title="langBtnTitle" title="語言">
        <svg><use href="#i-lang"/></svg>
      </button>
      <div id="langMenu" class="menu surface popover" role="menu" hidden></div>
    </div>

    <button id="statsBtn" class="btn btn-icon" type="button" aria-haspopup="dialog" aria-expanded="false"
            aria-controls="statsPanel"
            data-i18n-title="statsBtnTitle" title="統計全站正文字數">
      <svg><use href="#i-stats"/></svg>
    </button>

    <button id="helpBtn" class="btn btn-icon" type="button" aria-haspopup="dialog" aria-expanded="false"
            aria-controls="helpPanel"
            data-i18n-title="helpTitle" title="快捷鍵一覽（?）">
      <svg><use href="#i-help"/></svg>
    </button>

    <button id="settingsBtn" class="btn btn-icon" type="button" aria-haspopup="dialog" aria-expanded="false"
            aria-controls="settingsDrawer"
            data-i18n-title="settingsBtnTitle" title="閱讀設定">
      <svg><use href="#i-gear"/></svg>
    </button>

    <div class="menu-wrap more-wrap" id="moreWrap">
      <button id="moreBtn" class="btn btn-icon" type="button" aria-haspopup="true" aria-expanded="false"
              aria-controls="moreMenu"
              data-i18n-title="moreTitle" title="更多">
        <svg><use href="#i-more"/></svg>
      </button>
      <div id="moreMenu" class="menu surface popover" role="menu" hidden></div>
    </div>
  </div>
</header>

<main id="main">
  <aside id="chapterRail" data-i18n-label="railTitle" aria-label="目錄與書籤">
    <div class="rail-head">
      <h2 class="rail-title" data-i18n="railTitle">書目</h2>
      <button id="railClose" class="btn btn-icon rail-close" type="button" data-i18n-title="closeTitle" title="收起">
        <svg><use href="#i-close"/></svg>
      </button>
    </div>
    <div class="rail-tabs tabs" role="tablist" data-i18n-label="railTabsLabel" aria-label="左欄視圖">
      <button id="railTabOutline" class="rail-tab tab is-on" data-rail="outline" role="tab"
              aria-selected="true" data-i18n="railTabOutline">目錄</button>
      <button id="railTabBookmarks" class="rail-tab tab" data-rail="bookmarks" role="tab"
              aria-selected="false" data-i18n="railTabBookmarks">書籤</button>
    </div>
    <div id="railSearchBox" class="rail-search">
      <svg aria-hidden="true"><use href="#i-search"/></svg>
      <input id="railSearch" class="search-input" type="search" autocomplete="off" spellcheck="false"
             data-i18n-placeholder="railSearchPlaceholder" placeholder="篩選目錄…"
             data-i18n-label="railSearchPlaceholder" aria-label="篩選目錄">
    </div>
    <div id="chapterList" class="rail-list"></div>
  </aside>
  <div id="railScrim" class="scrim" hidden></div>

  <section id="reader" aria-live="polite">
    <header id="readerHead" class="reader-head">
      <div class="reader-title">
        <div class="reader-title-row">
          <div class="reader-headline">
            <p id="nodeChapter" class="crumb" hidden></p>
            <h2 id="nodeTitle" class="node-title" data-i18n="readerEmptyTitle">尚未選擇劇本</h2>
          </div>
          <div class="reader-actions">
            <button id="backBtn" class="btn btn-icon btn-sm" type="button" data-i18n-title="backTitle" title="上一處（←）" disabled>
              <svg><use href="#i-back"/></svg>
            </button>
            <button id="forwardBtn" class="btn btn-icon btn-sm" type="button" data-i18n-title="forwardTitle" title="下一處（→）" disabled>
              <svg><use href="#i-forward"/></svg>
            </button>
            <div class="menu-wrap reader-nav" id="navWrap">
              <button id="navBtn" class="btn btn-icon btn-sm" type="button" aria-haspopup="true" aria-expanded="false"
                      aria-controls="navMenu"
                      data-i18n-title="navBtnTitle" title="跳到相連劇本" disabled>
                <svg><use href="#i-jump"/></svg>
              </button>
              <div id="navMenu" class="menu menu-wide surface popover" role="menu" hidden></div>
            </div>
            <button id="bookmarkBtn" class="btn btn-icon btn-sm" type="button" aria-pressed="false"
                    data-i18n-title="bookmarkAdd" title="加入書籤">
              <svg><use href="#i-star"/></svg>
            </button>
          </div>
        </div>
      </div>
    </header>
    <div id="readerBody" class="reader-body"></div>
    <div class="reader-grip" data-edge="left" role="separator" aria-orientation="vertical"
         tabindex="0" data-i18n-title="gripTitle" title="拖動調整閱讀寬度"></div>
    <div class="reader-grip" data-edge="right" role="separator" aria-orientation="vertical"
         tabindex="0" data-i18n-title="gripTitle" title="拖動調整閱讀寬度"></div>
  </section>
</main>

<div id="settingsScrim" class="scrim" hidden></div>
<aside id="settingsDrawer" class="drawer surface" aria-modal="true" role="dialog"
       data-i18n-label="settingsTitle" aria-label="閱讀設定" hidden>
  <header class="drawer-head">
    <h2 class="drawer-title" data-i18n="settingsTitle">閱讀設定</h2>
    <button id="settingsClose" class="btn btn-icon" type="button" data-i18n-title="closeTitle" title="關閉">
      <svg><use href="#i-close"/></svg>
    </button>
  </header>

  <div class="drawer-body">
    <section class="field">
      <h3 class="field-title" data-i18n="fontReading">正文字體</h3>
      <button id="fontReadingTrigger" class="btn select font-trigger" type="button" aria-haspopup="listbox">
        <span class="ft-name">宋體（預設）</span>
        <svg class="caret" aria-hidden="true"><use href="#i-chevron"/></svg>
      </button>
      <input id="fontReadingCustom" class="input input-sm text-input" type="text" hidden
             data-i18n-placeholder="fontCustomPlaceholder" placeholder="輸入系統字體名，如 Noto Serif TC">
    </section>

    <section class="field">
      <h3 class="field-title" data-i18n="fontUi">介面字體</h3>
      <button id="fontUiTrigger" class="btn select font-trigger" type="button" aria-haspopup="listbox">
        <span class="ft-name">宋體</span>
        <svg class="caret" aria-hidden="true"><use href="#i-chevron"/></svg>
      </button>
      <input id="fontUiCustom" class="input input-sm text-input" type="text" hidden
             data-i18n-placeholder="fontCustomPlaceholder" placeholder="輸入系統字體名，如 Noto Sans TC">
    </section>

    <section class="field">
      <div class="field-row">
        <h3 class="field-title" data-i18n="fontSize">正文字號</h3>
        <output id="fontScaleOut" class="field-value">100%</output>
      </div>
      <input id="fontScale" class="range" type="range" min="80" max="200" step="5" value="100"
             data-i18n-label="fontSize" aria-label="正文字號">
    </section>

    <section class="field">
      <div class="field-row">
        <h3 class="field-title" data-i18n="lineHeight">行距</h3>
        <output id="leadingOut" class="field-value">1.85</output>
      </div>
      <input id="leading" class="range" type="range" min="1.2" max="2.6" step="0.05" value="1.85"
             data-i18n-label="lineHeight" aria-label="行距">
    </section>

    <section class="field">
      <div class="field-row">
        <h3 class="field-title" data-i18n="fontTypes">文本類型</h3>
        <span class="field-note" data-i18n="fontTypesHint">可分別設定</span>
      </div>
      <div class="type-groups" id="typeGroups" role="group" data-i18n-label="fontTypes" aria-label="文本類型"></div>
      <div class="type-tabs" id="typeChips" role="group" data-i18n-label="fontTypes" aria-label="文本類型"></div>

      <div class="type-panel">
        <label class="sub-label" data-i18n="typeFont">字體</label>
        <button id="typeFontTrigger" class="btn select font-trigger" type="button" aria-haspopup="listbox">
          <span class="ft-name">跟隨正文</span>
          <svg class="caret" aria-hidden="true"><use href="#i-chevron"/></svg>
        </button>
        <input id="typeFontCustom" class="input input-sm text-input" type="text" hidden
               data-i18n-placeholder="fontCustomPlaceholder" placeholder="輸入系統字體名">

        <div class="field-row sub-row">
          <label class="sub-label" data-i18n="typeScale">字號</label>
          <output id="typeScaleOut" class="field-value">100%</output>
        </div>
        <input id="typeScale" class="range" type="range" min="70" max="150" step="5" value="100"
               data-i18n-label="typeScale" aria-label="類型字號">

        <div class="field-row sub-row">
          <label class="sub-label" data-i18n="lineHeight">行距</label>
          <output id="typeLeadingOut" class="field-value">100%</output>
        </div>
        <input id="typeLeading" class="range" type="range" min="80" max="150" step="5" value="100"
               data-i18n-label="lineHeight" aria-label="類型行距">

        <label class="sub-label" data-i18n="typeWeight">字重</label>
        <div class="seg seg-wide tabs" id="weightSeg" role="group">
          <button class="seg-btn tab" type="button" data-weight="400" data-i18n="weightRegular">常規</button>
          <button class="seg-btn tab" type="button" data-weight="500" data-i18n="weightMedium">中等</button>
          <button class="seg-btn tab" type="button" data-weight="600" data-i18n="weightBold">加粗</button>
        </div>
      </div>
    </section>

    <section class="field">
      <h3 class="field-title" data-i18n="previewTitle">預覽</h3>
      <div class="preview" id="settingsPreview"></div>
    </section>
  </div>

  <footer class="drawer-foot">
    <button id="settingsReset" class="btn" type="button" data-i18n="resetSettings">恢復預設</button>
    <button id="settingsDone" class="btn" type="button" data-i18n="done">完成</button>
  </footer>
</aside>

<div id="fontPicker" class="picker popover surface" hidden role="listbox" data-i18n-label="typeFont" aria-label="字體">
  <div class="picker-search">
    <svg aria-hidden="true"><use href="#i-search"/></svg>
    <input id="fontPickerSearch" class="input input-sm" type="search" autocomplete="off" spellcheck="false"
           data-i18n-placeholder="fontSearchPlaceholder" placeholder="搜尋字體…"
           data-i18n-label="fontSearchPlaceholder" aria-label="搜尋字體">
  </div>
  <div id="fontPickerList" class="picker-list popover-list"></div>
</div>

<div id="lookupPanel" class="lookup surface popover" role="dialog" data-i18n-label="lookupSpeaker" aria-label="出場劇本" hidden>
  <header class="lookup-head">
    <span id="lookupTitle" class="panel-title lookup-title"></span>
    <button id="lookupClose" class="btn btn-icon btn-sm" type="button" data-i18n-title="closeTitle" title="關閉">
      <svg><use href="#i-close"/></svg>
    </button>
  </header>
  <p id="lookupSub" class="lookup-sub"></p>
  <div id="lookupList" class="lookup-list popover-list"></div>
  <p class="lookup-hint" data-i18n="lookupHint">Esc 關閉</p>
</div>

<div id="branchPreview" class="branch-preview surface popover" role="tooltip" hidden></div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<div id="ioStatus" class="io-status" role="status" aria-live="polite" hidden></div>

<div id="helpPanel" class="help-panel surface" role="dialog" aria-modal="true" aria-labelledby="helpHeading" hidden>
  <header class="panel-head">
    <h2 id="helpHeading" class="panel-title" data-i18n="helpTitle">快捷鍵</h2>
    <button id="helpClose" class="btn btn-icon btn-sm" type="button" data-i18n-title="closeTitle" title="關閉">
      <svg><use href="#i-close"/></svg>
    </button>
  </header>
  <div id="helpBody" class="help-body"></div>
  <p class="panel-hint" data-i18n="helpHint">按「?」關閉</p>
</div>

<div id="statsPanel" class="stats-panel surface" role="dialog" aria-modal="true"
     aria-labelledby="statsHeading" hidden>
  <header class="panel-head">
    <h2 id="statsHeading" class="panel-title" data-i18n="statsTitle">字數統計</h2>
    <button id="statsClose" class="btn btn-icon btn-sm" type="button" data-i18n-title="closeTitle" title="關閉">
      <svg><use href="#i-close"/></svg>
    </button>
  </header>
  <div id="statsSummary" class="stats-summary"></div>
  <div id="statsKinds" class="stats-kinds" role="group" data-i18n-label="fontTypes" aria-label="文本類型"></div>
  <div id="statsBody" class="stats-body"></div>
  <p class="panel-hint" data-i18n="statsHint">Esc 關閉 · 點章節展開劇本</p>
</div>

<script src="data/graph.js"></script>
<script src="js/10-schema.js"></script>
<script src="js/15-graph.js"></script>
<script src="js/20-storage.js"></script>
<script src="js/25-store.js"></script>
<script src="vendor/i18next.min.js"></script>
<script src="js/32-i18n.js"></script>
<script src="js/35-overlay.js"></script>
<script src="js/38-grip.js"></script>
<script src="js/40-text.js"></script>
<script src="js/45-checkpoints.js"></script>
<script src="js/50-settings.js"></script>
<script src="js/55-query.js"></script>
<script src="js/60-search.js"></script>
<script src="js/62-condexpr.js"></script>
<script src="js/65-beats.js"></script>
<script src="js/70-reader.js"></script>
<script src="js/75-rail.js"></script>
<script src="js/80-panels.js"></script>
<script src="js/85-stats.js"></script>
<script src="js/88-search-ui.js"></script>
<script src="js/90-filter-ui.js"></script>
<script src="js/92-settings-ui.js"></script>
<script src="js/94-shortcuts.js"></script>
<script src="js/96-app.js"></script>
<script src="js/99-boot.js"></script>

</body>
</html>
